name: Verify disabled receiver artifact
on:
  push:
    branches: [main]
    paths: ['hitv-ogads-receiver/**', '.github/workflows/verify.yml', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['hitv-ogads-receiver/**', '.github/workflows/verify.yml', '.github/workflows/release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receiver-verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: hitv-ogads-receiver
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify build and health-gate regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build once and test the exact archive
        run: python3 tools/release.py build --out dist --php php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receiver-candidate
          path: |
            hitv-ogads-receiver/dist/*.zip
            hitv-ogads-receiver/dist/*.sha256
            hitv-ogads-receiver/dist/release.json
            hitv-ogads-receiver/dist/package-manifest.json
            hitv-ogads-receiver/dist/verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receiver-test-evidence
          path: hitv-ogads-receiver/dist/evidence/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: receiver-candidate
          path: hitv-ogads-receiver/candidate
          digest-mismatch: error
      - name: Verify transferred archive without rebuilding
        run: python3 tools/release.py verify --directory candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hitv-receiver-verified
          path: hitv-ogads-receiver/candidate/
          if-no-files-found: error
          retention-days: 30
